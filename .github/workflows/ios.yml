# Builds an unsigned iOS app on a GitHub-hosted Mac and attaches it to a release.
# Unsigned .ipa files must be re-signed (AltStore, Sideloadly or Xcode) before they install.
name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the IPA to
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter packages
        run: flutter pub get

      # Packs the AI and voice models into the app, so it needs no download on first launch.
      - name: Built-in models
        run: bash tool/fetch_models.sh

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry kontrata-ios-unsigned.ipa Payload
          ls -la kontrata-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: kontrata-ios-unsigned
          path: kontrata-ios-unsigned.ipa

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" kontrata-ios-unsigned.ipa --clobber
